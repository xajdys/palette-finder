<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette Finder</title>
</head>

<body>
    <header>
        <hgroup>
            <h1>Palette Finder</h1>
            <p>Search, filter, and copy beautiful color palettes.</p>
        </hgroup>

        <search>
            <form>
                <label for="palette-search">Search palettes</label>
                <input type="search" id="palette-search" name="q" placeholder="Try sunset, ocean or forest">

                <label for="mood-filter">Filter by mood</label>
                <select id="mood-filter" name="mood">
                    <option value="">All moods</option>
                    <option value="warm">Warm</option>
                    <option value="cool">Cool</option>
                    <option value="calm">Calm</option>
                    <option value="bold">Bold</option>
                </select>
            </form>
        </search>
    </header>

    <main>
        <p id="no-results" hidden>
            No palettes match your search or filter.
        </p>

        <article class="palette" data-name="sunset jam" data-mood="warm">
            <h2>Sunset Jam</h2>
            <p>A warm palette inspired by evening skies.</p>

            <ul class="colors">
                <li data-color="#ff7b54">#ff7b54</li>
                <li data-color="#ffb26b">#ffb26b</li>
                <li data-color="#ffd56b">#ffd56b</li>
            </ul>

            <menu>
                <li>
                    <button type="button" class="copy-colors">
                        Copy color
                    </button>
                </li>
                <li>
                    <button type="button" class="favorite">
                        Favorite
                    </button>
                </li>
            </menu>
        </article>
    </main>
</body>

</html>
